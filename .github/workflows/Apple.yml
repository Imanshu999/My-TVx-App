name: iOS Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable || yarn install --frozen-lockfile
          else
            npm install --no-package-lock --legacy-peer-deps
          fi

      - name: Build web production bundle
        run: npm run build

      - name: Install CocoaPods
        if: hashFiles('ios/Podfile') != ''
        run: |
          sudo gem install cocoapods
          cd ios
          pod install --repo-update

      - name: Build iOS Simulator app
        if: hashFiles('ios/*.xcworkspace') != '' || hashFiles('ios/*.xcodeproj') != ''
        shell: bash
        run: |
          cd ios

          if ls *.xcworkspace >/dev/null 2>&1; then
            WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$(xcodebuild -list -workspace "$WORKSPACE" | sed -n '/Schemes:/,/^$/p' | sed -n '2p' | xargs)" \
              -sdk iphonesimulator \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build
          else
            PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)
            xcodebuild \
              -project "$PROJECT" \
              -sdk iphonesimulator \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build
          fi

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ios/build/
            dist/
            build/
          if-no-files-found: warn
