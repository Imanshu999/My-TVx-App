name: Ultimate Direct APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK, Environment & Properties
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        echo "org.gradle.daemon=false" >> gradle.properties
        echo "org.gradle.configureondemand=true" >> gradle.properties
        echo "org.gradle.parallel=true" >> gradle.properties
        echo "org.gradle.caching=true" >> gradle.properties
        echo "android.injected.testOnly=false" >> gradle.properties
        echo "android.enableR8.fullMode=false" >> gradle.properties

    - name: Ultimate Universal Build (Bypass All Errors)
      run: |
        # Agar gradlew nahi hai toh gradle command se wrapper bana lo
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.5
        fi
        
        chmod +x gradlew
        
        # Har tarah ke test, lint aur checking ko skip karke seedha APK nikalne ki koshish
        ./gradlew assembleDebug -x test -x lint -x check --no-daemon --continue || gradle assembleDebug --no-daemon --continue || ./gradlew bundleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: final-debug-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
