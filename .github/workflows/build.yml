name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Setup Correct Gradle Wrapper
      run: |
        # Gradle version 8.5 ka wrapper setup karenge jo sabhi projects ke liye best hai
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Build APK using Gradle Wrapper
      run: |
        ./gradlew assembleDebug -Djava.awt.headless=true --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiveTV-Debug-APK
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/app-debug.apk
