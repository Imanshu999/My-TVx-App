name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies & Build Web App
      run: |
        npm install
        # Agar aapka build command kuch aur hai (jaise npm run build), toh yahan likhein:
        # npm run build

    - name: Build Debug APK (Using Gradle or Web Wrapper)
      run: |
        echo "Building your Android APK package..."
        # Yahan aap apne Android project ke gradle build ko trigger kar sakte hain 
        # Agar aap Capacitor ya Cordova use kar rahe hain:
        # npx cap update android
        # cd android && ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiveTV-App-Debug
        path: |
          **/*.apk
          android/app/build/outputs/apk/debug/*.apk
          
