name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK Headless Mode
      run: |
        gradle wrapper
        chmod +x gradlew
        # -Djava.awt.headless=true डालकर AWT GUI क्रैश को रोकेंगे
        ./gradlew assembleDebug -Djava.awt.headless=true --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiveTV-Debug-APK
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/app-debug.apk
