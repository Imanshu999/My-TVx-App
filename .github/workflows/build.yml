name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Android SDK, Environment & Properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        touch .env .env.example
        
        # Generate debug keystore if not present
        if [ ! -f "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

        # Ensure gradle wrapper is present with Gradle 9.3.1 (required for AGP 9.1+)
        if [ ! -f "gradlew" ]; then
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O gradle-bin.zip
          unzip -q gradle-bin.zip
          ./gradle-9.3.1/bin/gradle wrapper --gradle-version 9.3.1
          rm -rf gradle-bin.zip gradle-9.3.1
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug -x test -x lint -x check --no-daemon --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
