name: Direct APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Path
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        echo "org.gradle.daemon=false" >> gradle.properties
        echo "org.gradle.configureondemand=true" >> gradle.properties
        echo "android.injected.testOnly=false" >> gradle.properties

    - name: Force Build APK (Ignore All Warnings)
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug -x test -x lint --no-daemon --continue || ./gradlew assembleDebug --no-daemon --continue

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
